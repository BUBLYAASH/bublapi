databaseChangeLog:
  - changeSet:
      id: 029-create-doctor-clinic-services
      author: Gleb Kovalev
      changes:
        - createTable:
            tableName: doctor_clinic_services
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doctor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: clinic_service_id
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: doctor_clinic_services
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_doctor_clinic_services_doctor

        - addForeignKeyConstraint:
            baseTableName: doctor_clinic_services
            baseColumnNames: clinic_service_id
            referencedTableName: clinic_services
            referencedColumnNames: id
            constraintName: fk_doctor_clinic_services_service

        - addUniqueConstraint:
            tableName: doctor_clinic_services
            columnNames: doctor_id, clinic_service_id
            constraintName: uk_doctor_clinic_service