databaseChangeLog:
  - changeSet:
      id: 007-create-doctor-working-hours
      author: Gleb Kovalev
      changes:
        - createTable:
            tableName: doctor_working_hours
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doctor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: day_of_week
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: time
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: doctor_working_hours
            baseColumnNames: doctor_id
            referencedTableName: doctors
            referencedColumnNames: id
            constraintName: fk_doctor_wh_doctor
        - addUniqueConstraint:
            tableName: doctor_working_hours
            columnNames: doctor_id, day_of_week, start_time, end_time
            constraintName: uk_doctor_wh_week