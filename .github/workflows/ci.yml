name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{steps.filter.outputs.backend}}
      admin: ${{steps.filter.outputs.admin}}
      demo: ${{steps.filter.outputs.demo}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            backend:
              - 'services/dent-backend/**'
              - 'VERSION'
              - 'deploy/**'
              - '.github/workflows/**'
            admin:
              - 'apps/admin/**'
              - 'deploy/**'
              - '.github/workflows/**'
            demo:
              - 'apps/dent-demo/**'
              - 'deploy/**'
              - '.github/workflows/**'
  backend:
    name: Backend tests and build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/dent-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/dent-backend/*.gradle
            services/dent-backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests and build
        run: bash ./gradlew build --no-daemon

  admin:
    name: Build admin
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build admin image
        run: docker build --tag bublapi-admin:ci ./apps/admin

  demo:
    name: Build demo
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build demo image
        run: docker build --tag bublapi-demo:ci ./apps/dent-demo