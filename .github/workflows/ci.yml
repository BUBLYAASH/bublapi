name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{steps.filter.outputs.backend}}
      admin: ${{steps.filter.outputs.admin}}
      demo: ${{steps.filter.outputs.demo}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            backend:
              - 'services/dent-backend/**'
              - 'VERSION'
              - 'deploy/**'
              - '.github/workflows/**'
            admin:
              - 'apps/admin/**'
              - 'deploy/**'
              - '.github/workflows/**'
            demo:
              - 'apps/dent-demo/**'
              - 'deploy/**'
              - '.github/workflows/**'
  backend:
    name: Backend tests and build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: services/dent-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/dent-backend/*.gradle
            services/dent-backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests and build
        run: bash ./gradlew build --no-daemon

  admin:
    name: Build admin
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build admin image
        run: docker build --tag bublapi-admin:ci ./apps/admin

  demo:
    name: Build demo
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build demo image
        run: docker build --tag bublapi-demo:ci ./apps/dent-demo

  deploy:
    name: Deploy to server
    needs: [ changes, backend, admin, demo ]

    if: >-
      ${{
        always() && !cancelled() && github.ref == 'refs/heads/main' &&
        github.event_name == 'workflow_dispatch' && needs.changes.result == 'success' &&
        contains(fromJSON('["success", "skipped"]'), needs.backend.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.admin.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.demo.result)
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions: { }

    concurrency:
      group: bublapi-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy checked commit
        shell: bash
        env:
          DEPLOY_HOST: ${{secrets.DEPLOY_HOST}}
          DEPLOY_USER: ${{secrets.DEPLOY_USER}}
          DEPLOY_SSH_KEY: ${{secrets.DEPLOY_SSH_KEY}}
          DEPLOY_KNOWN_HOSTS: ${{secrets.DEPLOY_KNOWN_HOSTS}}
          TARGET_SHA: ${{github.sha}}
          BACKEND_RESULT: ${{needs.backend.result}}
          ADMIN_RESULT: ${{needs.admin.result}}
          DEMO_RESULT: ${{needs.demo.result}}

        run: |
          set -euo pipefail
          umask 077
          
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          
          REMOTE_COMMAND="deploy $TARGET_SHA"
          
          if [[ "$BACKEND_RESULT" == "success" ]]; then
            REMOTE_COMMAND+=" backend"
          fi
          
          if [[ "$ADMIN_RESULT" == "success" ]]; then
            REMOTE_COMMAND+=" admin"
          fi
          
          if [[ "$demo_RESULT" == "success" ]]; then
            REMOTE_COMMAND+=" demo"
          fi
          
          ssh -T \
            -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "$REMOTE_COMMAND"