name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed applications
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      backend: ${{steps.filter.outputs.backend}}
      admin: ${{steps.filter.outputs.admin}}
      demo: ${{steps.filter.outputs.demo}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            backend:
              - 'services/dent-backend/**'
              - 'VERSION'
              - 'deploy/**'
              - '.github/workflows/**'
            admin:
              - 'apps/admin/**'
              - 'deploy/**'
              - '.github/workflows/**'
            demo:
              - 'apps/dent-demo/**'
              - 'deploy/**'
              - '.github/workflows/**'
  backend:
    name: Backend tests and build
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}

    defaults:
      run:
        working-directory: services/dent-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            services/dent-backend/*.gradle
            services/dent-backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests and build
        run: bash ./gradlew build --no-daemon

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail
          
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          APP_VERSION="$(tr -d '[:space:]' < ../../VERSION)"
          
          test -n "$APP_VERSION"
          
          printf 'name=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        env:
          IMAGE: ${{steps.image.outputs.name}}
          APP_VERSION: ${{steps.image.outputs.version}}
        run: |
          docker build --build-arg "APP_VERSION=$APP_VERSION" \
          --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          --tag "$IMAGE:$GITHUB_SHA" \
          .

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR"\
              --password-stdin

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "$IMAGE:$GITHUB_SHA"

          IMAGE_REF="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "$IMAGE:$GITHUB_SHA")"

          [[ "$IMAGE_REF" == "$IMAGE@sha256:"* ]]

          printf 'image=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
  admin:
    name: Build and publish admin
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-admin"
          printf 'name=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build admin image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            ./apps/admin

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "$IMAGE:$GITHUB_SHA"

          IMAGE_REF="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "$IMAGE:$GITHUB_SHA")"

          [[ "$IMAGE_REF" == "$IMAGE@sha256:"* ]]

          printf 'image=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

  demo:
    name: Build and publish demo
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-demo"
          printf 'name=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build demo image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" \
            ./apps/dent-demo

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker push "$IMAGE:$GITHUB_SHA"

          IMAGE_REF="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "$IMAGE:$GITHUB_SHA")"

          [[ "$IMAGE_REF" == "$IMAGE@sha256:"* ]]

          printf 'image=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`\n' "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to server
    needs: [ changes, backend, admin, demo ]

    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.ref == 'refs/heads/main' &&
        github.event_name == 'workflow_dispatch' &&
        needs.changes.result == 'success' &&
        needs.backend.result == 'success' &&
        needs.admin.result == 'success' &&
        needs.demo.result == 'success'
      }}

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions: { }

    concurrency:
      group: bublapi-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy checked commit
        shell: bash
        env:
          DEPLOY_HOST: ${{secrets.DEPLOY_HOST}}
          DEPLOY_USER: ${{secrets.DEPLOY_USER}}
          DEPLOY_SSH_KEY: ${{secrets.DEPLOY_SSH_KEY}}
          DEPLOY_KNOWN_HOSTS: ${{secrets.DEPLOY_KNOWN_HOSTS}}
          TARGET_SHA: ${{github.sha}}
          BACKEND_IMAGE: ${{ needs.backend.outputs.image }}
          ADMIN_IMAGE: ${{ needs.admin.outputs.image }}
          DEMO_IMAGE: ${{ needs.demo.outputs.image }}

        run: |
          set -euo pipefail
          umask 077
          
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          
          SSH_DIR="$(mktemp -d)"
          trap 'rm -rf "$SSH_DIR"' EXIT
          
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          
            validate_image() {
            local service="$1"
            local image="$2"
            local pattern="^ghcr\\.io/bublyaash/bublapi-${service}@sha256:[0-9a-f]{64}$"

            if [[ -n "$image" && ! "$image" =~ $pattern ]]; then
              echo "ERROR: invalid image reference for $service" >&2
              exit 1
            fi
          }

          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]

          validate_image backend "$BACKEND_IMAGE"
          validate_image admin "$ADMIN_IMAGE"
          validate_image demo "$DEMO_IMAGE"

          REMOTE_COMMAND="deploy-images $TARGET_SHA"
          REMOTE_COMMAND+=" ${BACKEND_IMAGE:--}"
          REMOTE_COMMAND+=" ${ADMIN_IMAGE:--}"
          REMOTE_COMMAND+=" ${DEMO_IMAGE:--}"
          
          ssh -T \
            -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "$REMOTE_COMMAND"