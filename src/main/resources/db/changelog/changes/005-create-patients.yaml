databaseChangeLog:
  - changeSet:
      id: 005-create-patients
      author: Gleb Kovalev
      changes:
        - createTable:
            tableName: patients
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: clinic_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    unique: true
              - column:
                  name: first_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: varchar(50)
              - column:
                  name: phone
                  type: varchar(15)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: birth_date
                  type: date
              - column:
                  name: notes
                  type: text
              - column:
                  name: allergies
                  type: text
              - column:
                  name: chronic_diseases
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: patients
            baseColumnNames: clinic_id
            referencedTableName: clinics
            referencedColumnNames: id
            constraintName: fk_patients_clinic
        - addForeignKeyConstraint:
            baseTableName: patients
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_patients_user_id
        - addUniqueConstraint:
            tableName: patients
            columnNames: clinic_id, phone
            constraintName: uk_patients_clinic_phone