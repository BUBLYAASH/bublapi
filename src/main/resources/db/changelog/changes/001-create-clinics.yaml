databaseChangeLog:
  - changeSet:
      id: 001-create-clinics
      author: Gleb Kovalev
      changes:
        - createTable:
            tableName: clinics
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: address
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(15)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: website
                  type: varchar(255)
              - column:
                  name: timezone
                  type: varchar(50)
                  defaultValue: "Europe/Moscow"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: clinics
            columnNames: title, address
            constraintName: uk_title_and_address