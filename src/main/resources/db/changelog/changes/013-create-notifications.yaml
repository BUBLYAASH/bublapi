databaseChangeLog:
  - changeSet:
      id: 013-create-notifications
      author: Gleb Kovalev
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: clinic_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: appointment_id
                  type: uuid
              - column:
                  name: type
                  type: varchar(25)
                  constraints:
                    nullable: false
              - column:
                  name: channel
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: "PENDING"
                  constraints:
                    nullable: false
              - column:
                  name: scheduled_at
                  type: timestamp
              - column:
                  name: sent_at
                  type: timestamp
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: clinic_id
            referencedTableName: clinics
            referencedColumnNames: id
            constraintName: fk_notifications_clinic
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_user
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: appointment_id
            referencedTableName: appointments
            referencedColumnNames: id
            constraintName: fk_notifications_appointment